version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: ecommerce
    ports:
      - "3306:3306"
    networks:
      - ecommerce-network
    volumes:
      - mysql-data:/var/lib/mysql

  user-service:
    image: ecommerce/user-service:v1
    container_name: user-service
    depends_on:
      - mysql
    ports:
      - "8081:8081"
    networks:
      - ecommerce-network

  product-service:
    image: ecommerce/product-service:v1
    container_name: product-service
    depends_on:
      - mysql
    ports:
      - "8082:8082"
    networks:
      - ecommerce-network

  order-service:
    image: ecommerce/order-service:v1
    container_name: order-service
    depends_on:
      - mysql
    ports:
      - "8083:8083"
    networks:
      - ecommerce-network

  payment-service:
    image: ecommerce/payment-service:v1
    container_name: payment-service
    depends_on:
      - mysql
    ports:
      - "8084:8084"
    networks:
      - ecommerce-network

  notification-service:
    image: ecommerce/notification-service:v1
    container_name: notification-service
    depends_on:
      - mysql
    ports:
      - "8085:8085"
    networks:
      - ecommerce-network

  api-gateway:
    image: ecommerce/api-gateway:v1
    container_name: api-gateway
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:

volumes:
  mysql-data:
