spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/users/**

            - id: product-service
              uri: http://product-service:8082
              predicates:
                - Path=/products/**

            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: http://payment-service:8084
              predicates:
                - Path=/payments/**

            - id: notification-service
              uri: http://notification-service:8085
              predicates:
                - Path=/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
